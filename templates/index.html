<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSec - Cliente RSA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 800px; width: 100%; }
        h1 { text-align: center; color: var(--accent); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--muted); margin-bottom: 25px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        textarea {
            width: 100%;
            height: 95px;
            background: #090d16;
            border: 1px solid var(--border);
            color: var(--accent-green);
            font-family: monospace;
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        label { display: block; margin: 10px 0 5px; font-size: 0.85rem; color: var(--muted); font-weight: bold; }
        
        /* Selector de acción */
        .action-selector {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            background: #090d16;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.95rem;
        }
        .action-btn.active-encrypt {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .action-btn.active-decrypt {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        /* Control de visibilidad de los módulos */
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CryptoSec</h1>
        <p class="subtitle">Herramienta Universal de Cifrado Asimétrico (RSA 2048-bits)</p>

        <!-- MÓDULO 1: MIS CLAVES DIGITALES (SIEMPRE VISIBLE) -->
        <div class="card">
            <h2>1. Mis Claves Digitales</h2>
            <button onclick="generateKeys()">Generar Mi Par de Claves</button>
            <div class="grid" style="margin-top: 10px;">
                <div>
                    <label>Mi Clave Pública (Compartir libremente):</label>
                    <textarea id="myPublic" readonly placeholder="Genera tus claves..."></textarea>
                </div>
                <div>
                    <label>Mi Clave Privada (NUNCA compartir):</label>
                    <textarea id="myPrivate" readonly placeholder="Genera tus claves..."></textarea>
                </div>
            </div>

            <!-- SELECCIÓN DE ACCIÓN -->
            <label style="margin-top: 20px; font-size: 1rem; color: var(--text);">¿Qué deseas hacer?</label>
            <div class="action-selector">
                <button type="button" id="btnModeEncrypt" class="action-btn" onclick="selectMode('encrypt')">🔒 Cifrar Mensaje</button>
                <button type="button" id="btnModeDecrypt" class="action-btn" onclick="selectMode('decrypt')">🔓 Descifrar Mensaje Recibido</button>
            </div>
        </div>

        <!-- MÓDULO 2: CIFRAR MENSAJE -->
        <div id="moduleEncrypt" class="card hidden">
            <h2>2. Cifrar Mensaje</h2>
            <label>Clave Pública del Destinatario:</label>
            <textarea id="destPublic" placeholder="Pega aquí la clave pública de la persona a la que le vas a enviar el mensaje..."></textarea>
            
            <label>Mensaje Claro:</label>
            <textarea id="plainMsg" placeholder="Escribe tu texto confidencial..."></textarea>
            
            <button onclick="encryptMsg()">Cifrar Mensaje</button>
            
            <label>Criptograma Resultante (Enviar por WhatsApp):</label>
            <textarea id="cipherResult" readonly placeholder="Copia este texto cifrado y envíalo por WhatsApp..."></textarea>
        </div>

        <!-- MÓDULO 3: DESCIFRAR MENSAJE RECIBIDO -->
        <div id="moduleDecrypt" class="card hidden">
            <h2>3. Descifrar Mensaje Recibido</h2>
            <label>Criptograma Recibido (De WhatsApp):</label>
            <textarea id="cipherInput" placeholder="Pega aquí el texto cifrado que te enviaron por WhatsApp..."></textarea>
            
            <label>Mi Clave Privada (Para descifrar):</label>
            <textarea id="myPrivateForDecrypt" placeholder="Pega tu clave privada o usa la generada arriba..."></textarea>
            
            <button style="background: var(--accent-green);" onclick="decryptMsg()">Descifrar Mensaje</button>
            
            <label>Mensaje Original Revelado:</label>
            <textarea id="decryptedResult" readonly placeholder="Aquí aparecerá el mensaje claro..."></textarea>
        </div>
    </div>

    <script>
        function selectMode(mode) {
            const modEncrypt = document.getElementById('moduleEncrypt');
            const modDecrypt = document.getElementById('moduleDecrypt');
            const btnEnc = document.getElementById('btnModeEncrypt');
            const btnDec = document.getElementById('btnModeDecrypt');

            if (mode === 'encrypt') {
                modEncrypt.classList.remove('hidden');
                modDecrypt.classList.add('hidden');
                btnEnc.classList.add('active-encrypt');
                btnDec.classList.remove('active-decrypt');
            } else {
                modDecrypt.classList.remove('hidden');
                modEncrypt.classList.add('hidden');
                btnDec.classList.add('active-decrypt');
                btnEnc.classList.remove('active-encrypt');
            }
        }

        async function generateKeys() {
            const res = await fetch('/generate-keys', { method: 'POST' });
            const data = await res.json();
            document.getElementById('myPublic').value = data.public_key;
            document.getElementById('myPrivate').value = data.private_key;
            document.getElementById('myPrivateForDecrypt').value = data.private_key;
        }

        async function encryptMsg() {
            const message = document.getElementById('plainMsg').value;
            const publicKey = document.getElementById('destPublic').value;
            if (!publicKey) return alert("Pega la clave pública del destinatario.");

            const res = await fetch('/encrypt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, public_key: publicKey })
            });
            const data = await res.json();
            if (data.ciphertext) {
                document.getElementById('cipherResult').value = data.ciphertext;
            } else {
                alert(data.error);
            }
        }

        async function decryptMsg() {
            const ciphertext = document.getElementById('cipherInput').value;
            const privateKey = document.getElementById('myPrivateForDecrypt').value;
            if (!ciphertext) return alert("Ingresa el texto cifrado.");
            if (!privateKey) return alert("Ingresa tu clave privada.");

            const res = await fetch('/decrypt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ciphertext: ciphertext, private_key: privateKey })
            });
            const data = await res.json();
            if (data.decrypted_message) {
                document.getElementById('decryptedResult').value = data.decrypted_message;
            } else {
                alert(data.error);
            }
        }
    </script>
</body>
</html>
